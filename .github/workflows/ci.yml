name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Services
        run: docker compose build

      - name: Run Application Tests
        run: docker compose run --rm app php artisan test

      - name: Cleanup Containers
        if: always()
        run: docker compose down -vname: Continuous Integration

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4
      # Step 2: Build the Docker services defined in docker-compose.yml
      - name: Build Docker Services
        run: docker compose build
      # Step 3: Tear down containers and volumes cleanly
      - name: Cleanup Containers
        if: always()
        run: docker compose down -v
