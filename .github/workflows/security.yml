name: Security Scan (SAST & DAST)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sast_scan:
    name: Run SAST (Code & Container Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Static Source Code Analysis with Semgrep
      - name: Run Semgrep SAST
        uses: semgrep/actions@v1
        with:
          config: p/default

      # 2. Secret & Vulnerability Scanning with Trivy
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  dast_scan:
    name: Run DAST (OWASP ZAP Target Analysis)
    runs-on: ubuntu-latest
    needs: sast_scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Spin up the application stack using Docker Compose
      - name: Launch App for DAST Testing
        run: |
          docker compose up -d
          # Pause brief seconds for services & DB migrations to settle
          sleep 10

      # 2. Attack the live running application endpoint
      - name: OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000' # Adjust port to your app's listening port
          fail_action: falsename: Security Scan (SAST & DAST)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sast_scan:
    name: Run SAST (Code & Container Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Semgrep SAST via official Docker Container
      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config=auto

      # 2. Free Vulnerability & Secret Scanning via Trivy
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  dast_scan:
    name: Run DAST (OWASP ZAP Target Analysis)
    runs-on: ubuntu-latest
    needs: sast_scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Spin up application stack via Docker Compose
      - name: Launch App for DAST Testing
        run: |
          docker compose up -d
          sleep 10

      # 2. Attack the running application endpoint
      - name: OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000' # Adjust port if your app listens on 80 or another port
          fail_action: false
