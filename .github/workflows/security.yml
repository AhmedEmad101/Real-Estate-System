name: Security Scan (SAST & DAST)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sast_scan:
    name: Run SAST (Code & Container Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Semgrep SAST via official Docker Container
      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config=auto

      # 2. Free Vulnerability & Secret Scanning via Trivy
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  dast_scan:
    name: Run DAST (OWASP ZAP Target Analysis)
    runs-on: ubuntu-latest
    needs: sast_scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Spin up application stack via Docker Compose
      - name: Launch App for DAST Testing
        run: |
          docker compose up -d
          sleep 10

      # 2. Attack the running application endpoint
      - name: OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:7000'
          fail_action: false
